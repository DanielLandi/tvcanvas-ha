name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Nightly, so a recent green HACS + hassfest run is always there to link in the
  # hacs/default catalog PR.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
# Least privilege: nothing by default; the jobs that check out code get read access.
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: PY=python scripts/check.sh
  hassfest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master
  # HACS validates public repositories only, so this job runs only in the public repo and is
  # skipped in private copies and forks.
  # No `ignore:` key: the catalog does not accept a run with ignored checks.
  # As documented, this job runs with `permissions: {}` (it reads the public repo via the API).
  hacs:
    if: github.repository == 'DanielLandi/tvcanvas-ha'
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
