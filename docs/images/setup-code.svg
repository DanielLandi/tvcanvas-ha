<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 880 246" width="880" height="246" role="img" aria-labelledby="title desc">
  <title id="title">Setting up TVCanvas in Home Assistant</title>
  <desc id="desc">The TVCanvas app shows a code. You type it into Home Assistant's TVCanvas setup. That's it: Home Assistant is connected to your TVCanvas account and your phone is paired for photos.</desc>
  <defs>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818b98"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- Arrows -->
    <path d="M238,136 H324" fill="none" stroke="#818b98" stroke-width="3" marker-end="url(#arrow-grey)"/>
    <path d="M552,136 H638" fill="none" stroke="#818b98" stroke-width="3" marker-end="url(#arrow-grey)"/>

    <!-- Arrow labels -->
    <rect x="239" y="90" width="84" height="28" rx="14" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/>
    <text x="281" y="109" font-size="14" fill="#1f2328">type it in</text>
    <rect x="553" y="90" width="84" height="28" rx="14" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/>
    <text x="595" y="109" font-size="14" fill="#1f2328">connects</text>

    <!-- 1. The app shows a code -->
    <rect x="16" y="36" width="220" height="164" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="126" y="74" font-size="19" font-weight="600" fill="#0a3069">TVCanvas app</text>
    <text x="126" y="98" font-size="14" fill="#0a3069">shows a code</text>
    <rect x="61" y="114" width="130" height="40" rx="20" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
    <g fill="#0a3069">
      <circle cx="81" cy="134" r="5"/>
      <circle cx="99" cy="134" r="5"/>
      <circle cx="117" cy="134" r="5"/>
      <circle cx="135" cy="134" r="5"/>
      <circle cx="153" cy="134" r="5"/>
      <circle cx="171" cy="134" r="5"/>
    </g>
    <text x="126" y="180" font-size="13" fill="#0a3069">Settings → Home Assistant</text>

    <!-- 2. Home Assistant's setup -->
    <rect x="330" y="36" width="220" height="164" rx="14" fill="#d1f4f4" stroke="#1b7c83" stroke-width="2"/>
    <text x="440" y="74" font-size="19" font-weight="600" fill="#0b4044">Home Assistant</text>
    <text x="440" y="98" font-size="14" fill="#0b4044">TVCanvas setup</text>
    <rect x="360" y="114" width="160" height="40" rx="8" fill="#ffffff" stroke="#1b7c83" stroke-width="1.5"/>
    <g fill="#0b4044">
      <circle cx="380" cy="134" r="5"/>
      <circle cx="398" cy="134" r="5"/>
      <circle cx="416" cy="134" r="5"/>
      <circle cx="434" cy="134" r="5"/>
      <circle cx="452" cy="134" r="5"/>
      <circle cx="470" cy="134" r="5"/>
    </g>
    <path d="M486,123 V145" stroke="#1b7c83" stroke-width="2"/>
    <text x="440" y="180" font-size="13" fill="#0b4044">Add integration → TVCanvas</text>

    <!-- 3. Done -->
    <rect x="644" y="36" width="220" height="164" rx="14" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/>
    <text x="754" y="74" font-size="19" font-weight="600" fill="#116329">Done</text>
    <g fill="none" stroke="#1a7f37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M664,116 l5,5 l9,-11"/>
      <path d="M664,155 l5,5 l9,-11"/>
    </g>
    <g text-anchor="start" font-size="14" fill="#116329">
      <text x="686" y="110">Home Assistant is</text>
      <text x="686" y="128">connected</text>
      <text x="686" y="150">Your phone is paired</text>
      <text x="686" y="168">for photos</text>
    </g>

    <!-- Footer note -->
    <rect x="270" y="222" width="340" height="30" rx="15" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/>
    <text x="440" y="242" font-size="14" font-weight="600" fill="#1f2328">One code, valid for 10 minutes, used once</text>
  </g>
</svg>
