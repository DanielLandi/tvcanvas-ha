<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" width="880" height="424" role="img" aria-labelledby="title desc">
  <title id="title">How TVCanvas for Home Assistant works</title>
  <desc id="desc">The TVCanvas app on your iPhone saves your pin in TVCanvas Cloud. Home Assistant checks the cloud for pins every minute and sends each image to your TV over your home network. Photos go from the phone straight to Home Assistant over your home network and never go through TVCanvas Cloud.</desc>
  <defs>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818b98"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2da44e"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- Home network -->
    <rect x="12" y="160" width="856" height="252" rx="20" fill="#2da44e" fill-opacity="0.10" stroke="#2da44e" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="652" y="176" width="196" height="30" rx="15" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
    <text x="750" y="196" font-size="15" font-weight="600" fill="#116329">Your home network</text>

    <!-- Arrows -->
    <path d="M131,240 V72 Q131,58 145,58 H314" fill="none" stroke="#818b98" stroke-width="3" marker-end="url(#arrow-grey)"/>
    <path d="M440,100 V234" fill="none" stroke="#818b98" stroke-width="3" marker-end="url(#arrow-grey)"/>
    <path d="M535,295 H648" fill="none" stroke="#818b98" stroke-width="3" marker-end="url(#arrow-grey)"/>
    <path d="M226,295 H339" fill="none" stroke="#2da44e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-green)"/>

    <!-- Arrow labels -->
    <rect x="83" y="114" width="96" height="28" rx="14" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/>
    <text x="131" y="133" font-size="14" fill="#1f2328">your pin</text>
    <rect x="378" y="116" width="124" height="28" rx="14" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/>
    <text x="440" y="135" font-size="14" fill="#1f2328">every minute</text>
    <rect x="557" y="256" width="72" height="28" rx="14" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/>
    <text x="593" y="275" font-size="14" fill="#1f2328">image</text>
    <rect x="244" y="256" width="80" height="28" rx="14" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
    <text x="284" y="275" font-size="14" fill="#116329">photos</text>

    <!-- TVCanvas Cloud -->
    <rect x="320" y="16" width="240" height="84" rx="14" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
    <text x="440" y="51" font-size="19" font-weight="600" fill="#3e1f79">TVCanvas Cloud</text>
    <text x="440" y="77" font-size="14" fill="#3e1f79">keeps your pins, draws boards</text>

    <!-- iPhone app -->
    <rect x="36" y="240" width="190" height="110" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="131" y="282" font-size="19" font-weight="600" fill="#0a3069">TVCanvas app</text>
    <text x="131" y="306" font-size="14" fill="#0a3069">on your iPhone:</text>
    <text x="131" y="326" font-size="14" fill="#0a3069">you choose what plays</text>

    <!-- Home Assistant -->
    <rect x="345" y="240" width="190" height="110" rx="14" fill="#d1f4f4" stroke="#1b7c83" stroke-width="2"/>
    <text x="440" y="282" font-size="19" font-weight="600" fill="#0b4044">Home Assistant</text>
    <text x="440" y="306" font-size="14" fill="#0b4044">keeps every TV</text>
    <text x="440" y="326" font-size="14" fill="#0b4044">up to date</text>

    <!-- TV -->
    <rect x="654" y="240" width="190" height="110" rx="14" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
    <text x="749" y="282" font-size="19" font-weight="600" fill="#5c2200">Your TV</text>
    <text x="749" y="306" font-size="14" fill="#5c2200">Samsung The Frame</text>
    <text x="749" y="326" font-size="14" fill="#5c2200">or Google Cast</text>

    <!-- Footer note -->
    <rect x="260" y="368" width="360" height="30" rx="15" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
    <text x="440" y="388" font-size="14" font-weight="600" fill="#116329">Photos never go through TVCanvas Cloud</text>
  </g>
</svg>
