[project]
name = "tvcanvas-ha"
version = "0.1.0"
requires-python = ">=3.14"
# PEP 639. Proposal, see LICENSE; to swap: replace LICENSE and change this one SPDX id.
license = "MIT"
license-files = ["LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
